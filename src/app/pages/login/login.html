<form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2>Welcome back</h2>

  <label for="username">Username</label>
  <input id="username" type="text" formControlName="username" />

  <label for="password">Password</label>
  <input id="password" type="password" formControlName="password" />

  <label class="check"><input type="checkbox" formControlName="remember" /> Remember my username</label>

  @if (error()) { <p class="error">{{ error() }}</p> }
  <button type="submit">Log in</button>
  <p>New here? <a routerLink="/signup">Create an account</a></p>
</form>
